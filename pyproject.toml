[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cavity-encoding-ml"
version = "0.3.0"
description = "Cavity encoding and leakage-safe validation for machine learning on multi-cavity injection molding data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Prince Nana Boakye", email = "bilalprince1723@gmail.com" },
  { name = "Hadyan Hafizh" },
  { name = "Pintu Lohar" },
  { name = "Anwar P. P. Abdul Majeed", email = "anwarm@sunway.edu.my" },
]
keywords = ["injection molding", "multi-cavity mold", "machine learning", "categorical encoding", "data leakage", "cross-validation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.22",
  "pandas>=1.4",
  "scipy>=1.8",
  "scikit-learn>=1.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
cavity-encoding-ml = "cavity_encoding_ml.cli:main"

[project.urls]
Homepage = "https://github.com/nanaboak/cavity-encoding-ml"
Issues = "https://github.com/nanaboak/cavity-encoding-ml/issues"
Changelog = "https://github.com/nanaboak/cavity-encoding-ml/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cavity_encoding_ml = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
